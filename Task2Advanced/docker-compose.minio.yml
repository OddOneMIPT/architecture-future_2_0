# Локальное S3-совместимое хранилище (MinIO) для удалённого backend Terraform.
#
# Запуск:
#   export DOCKER_HOST=unix:///var/run/docker.sock   # тот же демон, что использует terraform
#   docker compose -f docker-compose.minio.yml up -d
#
# Консоль MinIO:    http://localhost:9001  (minioadmin / minioadmin)
# S3 endpoint:      http://localhost:9000
services:
  minio:
    image: minio/minio:latest
    container_name: future20-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Одноразовый init-контейнер: создаёт бакет под terraform state.
  createbucket:
    image: minio/mc:latest
    container_name: future20-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
      mc mb -p local/future20-tfstate &&
      mc version enable local/future20-tfstate &&
      echo 'bucket future20-tfstate ready';
      "

volumes:
  minio-data:
